name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project LukeStore.xcodeproj -scheme LukeStore -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/LukeStore.app
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr LukeStore-r${{ github.run_number }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LukeStore-r${{ github.run_number }}
          path: LukeStore-r${{ github.run_number }}.ipa
