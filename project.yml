name: LukeStore
options:
  bundleIdPrefix: com.greenzin
  deploymentTarget:
    iOS: "16.0"
targets:
  LukeStore:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: LukeStore-Info/Info.plist
      properties:
        CFBundleDisplayName: LukeStore
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenzin.lukestore
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  LukeStore:
    build:
      targets:
        LukeStore: all
    run:
      config: Release
    archive:
      config: Release
